<!DOCTYPE html>
<html>
<head>
    <title>Program 2 - Addition</title>
</head>
<body>

    <h1>Addition of Two Numbers</h1>

    <script>
        let num1 = 10;
        let num2 = 20;

        let sum = num1 + num2;

        document.write("First Number: " + num1 + "<br>");
        document.write("Second Number: " + num2 + "<br>");
        document.write("Sum: " + sum);
    </script>

</body>
</html>
