<!DOCTYPE html>
<html>
<head>
    <title>Program 3 - Even or Odd</title>
</head>
<body>

    <h1>Check Even or Odd</h1>

    <script>
        let number = 15;

        if (number % 2 === 0) {
            document.write(number + " is an Even Number");
        } else {
            document.write(number + " is an Odd Number");
        }
    </script>

</body>
</html>
