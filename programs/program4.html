<!DOCTYPE html>
<html>
<head>
    <title>Program 4 - Largest Number</title>
</head>
<body>

    <h1>Find the Largest Number</h1>

    <script>
        let num1 = 25;
        let num2 = 40;
        let num3 = 15;

        let largest = Math.max(num1, num2, num3);

        document.write("Number 1: " + num1 + "<br>");
        document.write("Number 2: " + num2 + "<br>");
        document.write("Number 3: " + num3 + "<br>");
        document.write("<br>Largest Number: " + largest);
    </script>

</body>
</html>
